name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only when the project has a build script; the output folder
      # (dist/ or build/) is what gets published. Without one, the repo root
      # is published as-is.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: '22'

      - name: Build
        id: build
        run: |
          dir=.
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            if npm run | grep -q '^  build$'; then
              npm run build
              for d in dist build out; do
                if [ -d "$d" ]; then dir=$d; break; fi
              done
            fi
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing: $dir"

      - name: Load the deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pin the host key so a changed fingerprint fails the deploy rather
          # than silently trusting a new server.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          sudo apt-get install -y -qq lftp >/dev/null

      # The host allows SFTP but no shell, so rsync is not an option. lftp
      # mirrors the folder and removes files that were deleted from the repo,
      # leaving cPanel's own folders alone.
      - name: Publish over SFTP
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SRC: ${{ steps.build.outputs.dir }}
        run: |
          lftp -e "
            set sftp:auto-confirm no;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes';
            set net:max-retries 3;
            open -u $USER, -p $PORT sftp://$HOST;
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .git/ --exclude-glob .github/ \
              --exclude-glob node_modules/ --exclude-glob .kilocode/ \
              --exclude-glob .well-known/ --exclude-glob cgi-bin/ \
              --exclude-glob .env --exclude-glob '.env.*' \
              $SRC $DEPLOY_PATH;
            bye"
