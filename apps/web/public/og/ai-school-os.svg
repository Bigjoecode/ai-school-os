      <stop stop-color="#0b1330"/>
      <stop offset="1" stop-color="#1e2a5e"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#818cf8"/>
      <stop offset=".5" stop-color="#a78bfa"/>
