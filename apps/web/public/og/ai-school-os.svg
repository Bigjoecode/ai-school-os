  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="#5b5bf6" opacity=".18"/>
  <circle cx="1120" cy="560" r="200" fill="#22d3ee" opacity=".10"/>
  <g transform="translate(80 72) scale(1.5)">
